{% extends "base.html" %}{% block title %}{{ page_title }}{% endblock %}{% block content %}
<div class="form-layout"><a class="back-link" href="{{ url_for('index') }}">← Back to issues</a><p class="eyebrow">ISSUE MANAGEMENT</p><h1>{{ page_title }}</h1><p class="muted">Write enough detail for someone else to understand and reproduce the problem.</p>
<form method="post" class="panel form-panel"><label for="title">Issue title <span class="required">*</span></label><input id="title" name="title" maxlength="120" required value="{{ values.title }}" placeholder="e.g. Login form rejects valid email">
<label for="description">Description <span class="required">*</span></label><textarea id="description" name="description" rows="6" maxlength="5000" required placeholder="What did you expect? What happened? Steps to reproduce…">{{ values.description }}</textarea>
<div class="form-grid"><div><label for="priority">Priority</label><select id="priority" name="priority">{% for item in priorities %}<option value="{{ item }}" {% if values.priority == item %}selected{% endif %}>{{ item }}</option>{% endfor %}</select></div><div><label for="severity">Severity</label><select id="severity" name="severity">{% for item in severities %}<option value="{{ item }}" {% if values.severity == item %}selected{% endif %}>{{ item }}</option>{% endfor %}</select></div><div><label for="assignee">Assignee</label><input id="assignee" name="assignee" maxlength="80" value="{{ values.assignee }}" placeholder="Team member"></div><div><label for="due_date">Due date</label><input id="due_date" name="due_date" type="date" value="{{ values.due_date }}"></div></div>
<label for="labels">Labels <span class="muted inline-note">(optional)</span></label><input id="labels" name="labels" maxlength="160" value="{{ values.labels }}" placeholder="frontend, login, regression">
<div class="form-actions"><a class="button secondary" href="{{ url_for('index') }}">Cancel</a><button class="button primary" type="submit">{{ button_text }}</button></div></form></div>{% endblock %}
